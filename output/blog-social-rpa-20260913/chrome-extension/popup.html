<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ファミーユRPA</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>ファミーユRPA</h1>
      <p id="page-status" class="status">確認中...</p>
      <section id="onboarding-actions" hidden>
        <button id="open-side-panel" type="button">基本情報を転記</button>
        <p class="hint">PDFと候補を確認し、新規登録または既存利用者の編集欄へ反映します。</p>
      </section>
      <section id="job-rpa" hidden>
        <h2>求人RPA</h2>
        <p id="job-rpa-page-status" class="status"></p>
        <label id="kaitek-preset-row" hidden>カイテク求人
          <select id="kaitek-preset-select" aria-label="カイテク求人"></select>
        </label>
        <label id="ucare-preset-row" hidden>Ucareテンプレート
          <select id="ucare-preset-select" aria-label="Ucareテンプレート"></select>
        </label>
        <label>対象週の月曜日 <input id="job-week-start" type="date" /></label>
        <fieldset>
          <legend>募集日</legend>
          <div id="job-date-options"></div>
        </fieldset>
        <p class="hint">人数・時給・勤務条件はテンプレート／既存求人の値を変更しません。</p>
        <button id="inspect-job-rpa" type="button" class="secondary">画面を確認</button>
        <button id="execute-job-rpa" type="button">選択日で実行</button>
        <p id="job-rpa-status" class="status"></p>
      </section>
      <section id="taimee-actions" hidden>
        <button id="open-taimee-side-panel" type="button">タイミー勤務者フォローを開く</button>
        <p class="hint">対象者の取得、確認、SMS送信を行います。</p>
      </section>
      <section id="client-details" hidden>
        <h2>カイポケID</h2>
        <p id="kaipoke-cs-id" class="client-id"></p>
        <h2>Myファミーユ</h2>
        <p id="lookup-status" class="status">確認中...</p>
        <button id="update-client" type="button" class="secondary" hidden>カイポケ情報を更新</button>
        <div id="lineworks-details" hidden>
          <h2>LINE WORKS</h2>
          <p id="lineworks-status" class="status"></p>
          <h2>メンバー</h2>
          <p id="members-status" class="status"></p>
        </div>
      </section>
      <section id="sharefull-actions" hidden>
        <button id="open-sharefull-side-panel" type="button">Sharefull案件一覧を開く</button>
        <p class="hint">MyFamilleのスポット募集案件を選択して、Sharefullテンプレートを作成します。</p>
      </section>
      <section id="runner-bridge-settings">
        <h2>常駐Runner連携</h2>
        <label>共有トークン <input id="runner-bridge-token" type="password" autocomplete="off" /></label>
        <label>ポート <input id="runner-bridge-port" type="number" min="1" max="65535" value="43123" /></label>
        <button id="save-runner-bridge" type="button" class="secondary">Runner連携を保存</button>
        <p id="runner-bridge-status" class="status">未設定</p>
      </section>      <section id="diagnostic-actions" class="diagnostic-actions">
        <button id="save-diagnostic" type="button" class="diagnostic-button">ページ診断情報を送信</button>
        <p class="diagnostic-note">※不具合・エラー時に、調査用のページ情報を送信します。</p>
        <p id="diagnostic-status" class="diagnostic-status"></p>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
